[project]
name = "djelia-mcp-server"
version = "0.1.0"
description = "MCP server for Djelia APIs (Bambara transcription, translation, TTS)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py"]
